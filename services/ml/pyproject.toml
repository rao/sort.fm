[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sortfm-ml"
version = "0.1.0"
description = "Internal ML service for sort.fm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sortfm_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
